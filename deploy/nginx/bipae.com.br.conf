# Nginx do HOST (VPS 72.60.10.112) para www.bipae.com.br.
# Instalado uma única vez por deploy/setup-host.sh. Depois, o certbot (--nginx) acrescenta
# os blocos HTTPS (listen 443 + certificado) e o redirecionamento HTTP -> HTTPS.
# O compose do Bipaê só escuta em 127.0.0.1:3400 (landing em /, app em /app/, API em /v1/).

# Domínio sem www -> www (endereço canônico).
server {
  listen 80;
  listen [::]:80;
  server_name bipae.com.br;
  return 301 https://www.bipae.com.br$request_uri;
}

server {
  listen 80;
  listen [::]:80;
  server_name www.bipae.com.br;

  client_max_body_size 4m;

  location / {
    proxy_pass http://127.0.0.1:3400;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 60s;
  }
}
