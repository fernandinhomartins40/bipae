[package]
name = "bipae-desktop"
version = "0.1.0"
description = "Bipaê Desktop — PDV de balcão com periféricos e operação offline"
authors = ["Bipaê"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "bipae_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
