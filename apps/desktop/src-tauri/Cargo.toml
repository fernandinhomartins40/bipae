[package]
name = "bipae-desktop"
version = "0.1.0"
description = "Bipaê Desktop — PDV de balcão com periféricos e operação offline"
authors = ["Bipaê"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "bipae_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
# Signed auto-update. Enabled only in release builds that have the signing key (CI secrets),
# together with tauri.updater.conf.json. See docs/plataformas.md.
updater = ["dep:tauri-plugin-updater", "dep:tauri-plugin-process"]

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
serialport = "4"
tokio = { version = "1", features = ["net"] }
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
base64 = "0.22"
getrandom = "0.3"
# Abre links (MercadoFlow, termos) no navegador do sistema; só https, ver capabilities.
tauri-plugin-opener = "2"
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
