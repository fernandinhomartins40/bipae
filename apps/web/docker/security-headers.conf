# Included in every location: in nginx an add_header inside a location cancels the
# server-level ones, so security headers must be repeated wherever caching headers are set.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), serial=(self), usb=(self)" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# - 'wasm-unsafe-eval': SQLite WASM (offline register) needs to compile WebAssembly.
# - ws://127.0.0.1:47800: the Bipaê Conector on this computer (peripherals).
# - ${API_ORIGIN}: empty when the API is served on the same origin (/v1).
add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ws://127.0.0.1:47800 ${API_ORIGIN}; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
