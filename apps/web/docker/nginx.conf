# www.bipae.com.br inside the container (the host nginx terminates HTTPS):
#   /       landing page (static)
#   /app/   the Bipaê app (SPA + PWA)
#   /v1/    the API (same origin)
server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;
  absolute_redirect off;

  gzip on;
  gzip_types text/css application/javascript application/json application/wasm image/svg+xml application/xml;

  include /etc/nginx/conf.d/snippets/security-headers.conf;

  # API on the same origin. The host nginx sets X-Forwarded-*; pass them on so rate limits
  # see the real client IP.
  location /v1/ {
    proxy_pass http://api:3333;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 60s;
    client_max_body_size 2m;
  }

  location = /app {
    return 301 /app/;
  }

  # The service worker must never be cached, or updates would not arrive.
  location = /app/sw.js {
    include /etc/nginx/conf.d/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  location /app/assets/ {
    include /etc/nginx/conf.d/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # App: SPA fallback (browser routing under /app).
  location /app/ {
    include /etc/nginx/conf.d/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /app/index.html;
  }

  location /assets/ {
    include /etc/nginx/conf.d/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # Landing page: unknown paths are a real 404 (good for search engines).
  location / {
    try_files $uri $uri/ =404;
  }
}
