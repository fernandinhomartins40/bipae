name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24

jobs:
  quality:
    name: Lint, typecheck e testes (PGlite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Backlog válido (docs/TAREFAS.md) e modo /goal
        run: |
          pnpm -s tarefas
          node --test scripts/*.test.mjs
      - run: pnpm typecheck
      - run: pnpm test

  api-postgres:
    name: API contra PostgreSQL 16 e Redis reais
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bipae_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bipae/api test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/bipae_test
          TEST_REDIS_URL: redis://localhost:6379
      # O que vai para produção é o pacote compilado (ESM), não o código-fonte dos testes.
      - name: Pacote compilado da API sobe com Redis
        run: pnpm --filter @bipae/api build && node scripts/smoke-api.mjs
        env:
          REDIS_URL: redis://localhost:6379
      - name: Pacote compilado da API sobe com o Redis fora do ar
        run: node scripts/smoke-api.mjs
        env:
          REDIS_URL: redis://localhost:6399
          SMOKE_REDIS_DOWN: 1

  e2e:
    name: E2E (web e desktop-ui)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bipae/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report

  pdv-embed:
    name: Kit PDV Embed (Node, PHP e navegador)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring
          coverage: none
      - run: pnpm install --frozen-lockfile
      - name: Conformidade do contrato (implementações Node e PHP)
        run: pnpm --filter @bipae/pdv-embed test
        env:
          BIPAE_REQUIRE_PHP: '1'
      - name: dist/bipae-pdv.js está atualizado
        run: |
          pnpm --filter @bipae/pdv-embed build
          git diff --exit-code -- kits/pdv-embed/dist || { echo 'Rode pnpm --filter @bipae/pdv-embed build e versione o dist.'; exit 1; }
      - run: pnpm --filter @bipae/pdv-embed exec playwright install --with-deps chromium
      - name: E2E do componente
        run: pnpm --filter @bipae/pdv-embed e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pdv-embed-playwright
          path: kits/pdv-embed/test-results

  build:
    name: Build web (PWA) e API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bipae/web build
      - run: pnpm --filter @bipae/api build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Dependências do WebKitGTK (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev
      - run: pnpm install --frozen-lockfile
      # generate_context! embeds the frontend at compile time, so it must exist before cargo test.
      - name: Build do frontend desktop
        run: pnpm --filter @bipae/desktop build:web
      - name: Testes Rust (banco local, periféricos, Conector)
        working-directory: apps/desktop/src-tauri
        run: cargo test
      - name: Testes Rust com o atualizador
        working-directory: apps/desktop/src-tauri
        run: cargo check --features updater
      # Unsigned installers; signed builds and update channels come from release-desktop.yml.
      - name: Build do app desktop (instaladores sem assinatura)
        env:
          VITE_API_URL: https://www.bipae.com.br
        run: pnpm --filter @bipae/desktop tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: bipae-desktop-${{ runner.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
