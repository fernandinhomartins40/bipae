name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24

jobs:
  quality:
    name: Lint, typecheck e testes (PGlite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Backlog válido (docs/TAREFAS.md) e modo /goal
        run: |
          pnpm -s tarefas
          node --test scripts/*.test.mjs
      - run: pnpm typecheck
      - run: pnpm test

  api-postgres:
    name: API contra PostgreSQL 16 e Redis reais
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bipae_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bipae/api test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/bipae_test
          TEST_REDIS_URL: redis://localhost:6379
      # O que vai para produção é o pacote compilado (ESM), não o código-fonte dos testes.
      - name: Pacote compilado da API sobe com Redis
        run: pnpm --filter @bipae/api build && node scripts/smoke-api.mjs
        env:
          REDIS_URL: redis://localhost:6379
      - name: Pacote compilado da API sobe com o Redis fora do ar
        run: node scripts/smoke-api.mjs
        env:
          REDIS_URL: redis://localhost:6399
          SMOKE_REDIS_DOWN: 1

  e2e:
    name: E2E (web e desktop-ui)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bipae/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report

  pdv-embed:
    name: Kit PDV Embed (Node, PHP e navegador)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring
          coverage: none
      - run: pnpm install --frozen-lockfile
      - name: Conformidade do contrato (implementações Node e PHP)
        run: pnpm --filter @bipae/pdv-embed test
        env:
          BIPAE_REQUIRE_PHP: '1'
      - name: dist/bipae-pdv.js está atualizado
        run: |
          pnpm --filter @bipae/pdv-embed build
          git diff --exit-code -- kits/pdv-embed/dist || { echo 'Rode pnpm --filter @bipae/pdv-embed build e versione o dist.'; exit 1; }
      - run: pnpm --filter @bipae/pdv-embed exec playwright install --with-deps chromium
      - name: E2E do componente
        shell: bash
        run: bash scripts/ci-annotate.sh "E2E do componente" pnpm --filter @bipae/pdv-embed e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pdv-embed-playwright
          path: kits/pdv-embed/test-results

  build:
    name: Build web (PWA) e API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bipae/web build
      - run: pnpm --filter @bipae/api build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS (F7-06): aplicativo universal (Intel e Apple Silicon).
        os: [windows-latest, ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Dependências do WebKitGTK (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev
      - run: pnpm install --frozen-lockfile
      # generate_context! embeds the frontend at compile time, so it must exist before cargo test.
      - name: Build do frontend desktop
        run: pnpm --filter @bipae/desktop build:web
      # Em caso de falha, as linhas de erro do cargo viram anotação (legível sem abrir o log).
      - name: Testes Rust (banco local, periféricos, Conector)
        working-directory: apps/desktop/src-tauri
        shell: bash
        run: |
          set -o pipefail
          if ! cargo test --color never 2>&1 | tee cargo.log; then
            sed -i 's/\x1b\[[0-9;]*m//g;s/\r//g' cargo.log
            found=$(grep -E -A8 '^(error|failures:|---- )' cargo.log | head -80)
            [ -n "$found" ] || found=$(tail -40 cargo.log)
            msg=$(printf '%s' "$found" | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=cargo test::${msg}"
            exit 1
          fi
      - name: Testes Rust com o atualizador
        working-directory: apps/desktop/src-tauri
        run: cargo check --features updater
      # Unsigned installers; signed builds and update channels come from release-desktop.yml.
      - name: Build do app desktop (instaladores sem assinatura)
        if: runner.os != 'macOS'
        env:
          VITE_API_URL: https://www.bipae.com.br
        shell: bash
        run: bash scripts/ci-annotate.sh "tauri build" pnpm --filter @bipae/desktop tauri build
      - name: Build do app desktop no macOS (universal, .app e .dmg sem assinatura)
        if: runner.os == 'macOS'
        env:
          VITE_API_URL: https://www.bipae.com.br
        shell: bash
        run: bash scripts/ci-annotate.sh "tauri build" pnpm --filter @bipae/desktop tauri build --target universal-apple-darwin --bundles app,dmg
      - uses: actions/upload-artifact@v4
        with:
          name: bipae-desktop-${{ runner.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  # F2-10: o app de verdade, no WebView do sistema (WebView2 no Windows, WebKitGTK no Linux),
  # pilotado pelo tauri-driver: entra, abre o caixa e vende com o banco SQLite nativo.
  desktop-webview:
    name: Desktop no WebView real (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Dependências do WebKitGTK e do WebDriver (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev webkit2gtk-driver xvfb
      - run: pnpm install --frozen-lockfile
      - name: tauri-driver
        run: cargo install tauri-driver --locked
      - name: msedgedriver na versão do WebView2 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool --locked
          msedgedriver-tool
          $dir = (Get-Location).Path
          echo "$dir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: App em modo de teste (sem instalador)
        env:
          VITE_API_URL: http://localhost:3333
        run: pnpm --filter @bipae/desktop tauri build --debug --no-bundle
      - name: API local (PGlite em memória)
        shell: bash
        env:
          PORT: '3333'
          DATABASE_URL: pglite://memory
          CORS_ORIGINS: http://tauri.localhost,tauri://localhost,http://localhost:1420
          LOGIN_RATE_LIMIT_PER_MINUTE: '1000'
        run: |
          nohup pnpm --filter @bipae/api exec tsx src/main.ts > api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3333/v1/health && exit 0; sleep 2; done
          cat api.log; exit 1
      - name: O app abre e fica aberto? (diagnóstico, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          $exe = "$PWD/apps/desktop/src-tauri/target/debug/bipae-desktop.exe"
          $p = Start-Process -FilePath $exe -PassThru -RedirectStandardOutput app-out.log -RedirectStandardError app-err.log
          Start-Sleep -Seconds 15
          $vivo = -not $p.HasExited
          $saida = (Get-Content app-out.log, app-err.log -ErrorAction SilentlyContinue | Select-Object -Last 30) -join '%0A'
          if ($vivo) { Stop-Process -Id $p.Id -Force }
          Write-Output "::warning title=App no Windows::aberto depois de 15 s: $vivo; código: $($p.ExitCode)%0A$saida"
      - name: Venda dentro do app (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          NATIVE_DRIVER: ${{ github.workspace }}\msedgedriver.exe
        run: bash scripts/ci-annotate.sh "WebView (Windows)" node apps/desktop/e2e-webview/sale.mjs "$PWD/apps/desktop/src-tauri/target/debug/bipae-desktop.exe"
      - name: Venda dentro do app (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/ci-annotate.sh "WebView (Linux)" xvfb-run -a node apps/desktop/e2e-webview/sale.mjs "$PWD/apps/desktop/src-tauri/target/debug/bipae-desktop"
      - name: Log da API
        if: failure()
        shell: bash
        run: |
          tail -60 api.log || true
          msg=$(tail -30 api.log 2>/dev/null | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
          echo "::error title=Log da API::${msg}"
