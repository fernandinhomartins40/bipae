# Fontes oficiais do Rio de Janeiro (F3-26.c.RJ).
# O site de legislação da SEFAZ-RJ bloqueia o endereço da VPS e o do computador de desenvolvimento.
# Esta tarefa testa se as máquinas do GitHub conseguem abrir o site e conta o resultado nas
# anotações da execução. Só lê: não envia nada para a SEFAZ-RJ além do pedido da página.
name: Fontes oficiais do RJ

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/fontes-rj.yml']

permissions:
  contents: read

jobs:
  testar-acesso:
    name: Testar o acesso ao site da SEFAZ-RJ
    runs-on: ubuntu-latest
    steps:
      - name: Abrir as páginas e contar o resultado
        run: |
          for url in \
            "https://legislacao.fazenda.rj.gov.br/" \
            "https://portal.fazenda.rj.gov.br/legislacao/" \
            "https://www.fazenda.rj.gov.br/sefaz/faces/oracle/webcenter/portalapp/pages/navigation-renderer.jspx"; do
            code=$(curl -sL -A "Mozilla/5.0" -m 60 -o pagina.html -w "%{http_code}" "$url" || echo erro)
            size=$(wc -c < pagina.html 2>/dev/null || echo 0)
            if grep -q "endereços IP usados por serviços residenciais" pagina.html 2>/dev/null; then
              situacao="bloqueado"
            else
              situacao="liberado"
            fi
            echo "::notice title=SEFAZ-RJ::${situacao} | HTTP ${code} | ${size} bytes | ${url}"
          done
